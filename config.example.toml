# Set readonly = false and restart to expose mutation tools.
readonly = true
trash_mailbox = "Trash"

[imap]
host = "imap.example.com"
port = 993
username = "user@example.com"
password = "replace-me"
# Exact modes: auto (default if omitted), tls, starttls, none.
# auto/tls default to port 993; starttls/none default to port 143.
# The explicit port above overrides those defaults.
# auto on 993 uses verified implicit TLS. On other ports it upgrades only
# when STARTTLS is advertised; otherwise plaintext is normal.
# Use tls for a custom implicit-TLS port, or starttls to require an upgrade.
# none stays plaintext even when STARTTLS is advertised.
# An attempted TLS upgrade or certificate failure never falls back or retries.
tls = "auto"
connect_timeout_seconds = 10
operation_timeout_seconds = 60
# ca_file = "private-ca.pem"

[cache]
# Empty uses the OS user cache directory: imap-mcp/headers.sqlite3.
# Relative paths resolve beside this configuration file.
path = ""
