# Full replacement: do not include the image's FTS/index/protocol defaults.
# See testbed/README.md for fixture invariants.
dovecot_config_version = 2.4.5
dovecot_storage_version = 2.4.5
protocols = imap
listen = *
base_dir = /tmp/dovecot
state_dir = /tmp/dovecot
log_path = /dev/stderr
info_log_path = /dev/stderr
default_internal_user = vmail
default_internal_group = vmail
default_login_user = vmail

auth_mechanisms = plain login
auth_allow_cleartext = no
ssl = required
ssl_min_protocol = TLSv1.2
ssl_server_cert_file = /fixture/server.crt
ssl_server_key_file = /fixture/server.key

mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
mail_driver = maildir
mail_home = /srv/vmail/%{user}
mail_path = ~/Maildir
mailbox_list_layout = maildir++
mailbox_list_utf8 = yes
# Dovecot requires this even when only advertising (not enabling) IMAP4rev2.
mail_utf8_extensions = yes
imap4rev2_enable = yes

namespace inbox {
  inbox = yes
  separator = /
}

passdb passwd-file {
  passwd_file_path = /fixture/users
}
userdb static {
  fields {
    uid = 1000
    gid = 1000
    home = /srv/vmail/%{user}
  }
}

service imap-login {
  inet_listener imap {
    port = 31143
  }
  inet_listener imaps {
    port = 31993
    ssl = yes
  }
}
service auth {
  user = vmail
}
service auth-worker {
  user = vmail
}
